<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GO13">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.svg">
  <link rel="stylesheet" href="styles.css">
  <title>GO13 · GO-USA</title>
</head>
<body>
  <header class="app-header">
    <div class="brand"><img src="icon-192.svg" alt="GO13"><div><strong>GO13</strong><span>GO-USA</span></div></div>
    <div class="header-actions">
      <button id="homeBtn" class="icon-btn" aria-label="פתח אפשרויות iPhone">⌂</button>
      <button id="specialJump" class="icon-btn" aria-label="תצוגה מיוחדת">✦</button>
    </div>
  </header>

  <main>
    <section class="day-shell" id="dayShell">
      <div class="day-picker" id="dayPicker"></div>
      <div id="dayView"></div>
    </section>

    <section class="secondary-tabs-wrap" id="secondarySection">
      <nav class="secondary-tabs">
        <button class="secondary-tab active" data-tab="bookings">הוזמן</button>
        <button class="secondary-tab" data-tab="sites">מדריך אתרים</button>
      </nav>
      <div id="secondaryContent"></div>
    </section>

    <section class="special-section" id="specialSection">
      <div class="special-heading">
        <div><span class="eyebrow">EXTRA</span><h2>התצוגה המיוחדת</h2><p>מפת מסע ויזואלית, רגעי עוגן ותקציר של כל הדרך — לשימוש כשבאמת צריך.</p></div>
        <button id="specialToggle" class="special-toggle">פתח תצוגה</button>
      </div>
      <div id="specialContent" class="special-content collapsed"></div>
    </section>
  </main>

  <div id="toast" class="toast" aria-live="polite"></div>

  <script src="app-data-GO13.js"></script>
  <script src="app.js"></script>
</body>
</html>
