<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GO Trip 2026">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>USA Father & Son Trip 2026</title>
  <style>
    :root{--bg:#eef3f8;--surface:#fff;--surface2:#f7f9fc;--text:#162033;--muted:#65738a;--line:#dbe3ed;--blue:#1976ff;--blue2:#0b4db7;--green:#15804b;--green-soft:#e7f7ee;--amber:#a15e00;--amber-soft:#fff4dc;--red:#c43b35;--red-soft:#fdeceb;--navy:#0c1730;--shadow:0 8px 28px rgba(16,36,64,.08)}
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;-webkit-text-size-adjust:100%}
    body{background:linear-gradient(180deg,#eaf0f7 0%,#f8fafc 52%,#edf1f6 100%);color:var(--text)}
    body.phase-night{background:linear-gradient(180deg,#0a1324 0%,#0f1b30 52%,#101827 100%);--surface:#121d31;--surface2:#162338;--text:#f7f9fc;--muted:#a8b5c6;--line:#2b3a51;--blue:#4da0ff}
    body.phase-morning{background:linear-gradient(180deg,#dfeeff 0%,#f9fbff 55%,#eef3f8 100%)}
    body.phase-evening{background:linear-gradient(180deg,#d7def0 0%,#eef2f8 45%,#e7ebf2 100%)}
    button,input,textarea,select{font:inherit}
    a{color:inherit}
    .app-shell{min-height:100vh;padding-bottom:calc(126px + env(safe-area-inset-bottom))}
    header{position:sticky;top:0;z-index:40;background:rgba(9,23,47,.9);backdrop-filter:blur(18px);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid rgba(255,255,255,.10)}
    .head{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:15px;object-fit:cover;flex:none;box-shadow:0 5px 18px rgba(0,0,0,.25)}.head-copy{min-width:0}.title{font-size:19px;font-weight:900;letter-spacing:-.35px}.sub{font-size:11px;color:rgba(255,255,255,.72);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.head-action{margin-inline-start:auto;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;border-radius:12px;min-width:42px;height:42px}
    .day-tabs{display:flex;gap:7px;overflow-x:auto;padding:9px 0 1px;scrollbar-width:none}.day-tabs::-webkit-scrollbar{display:none}.day-tab{flex:0 0 auto;min-width:70px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#fff;border-radius:12px;padding:8px 9px;font-size:11px;font-weight:800}.day-tab small{display:block;opacity:.7;margin-bottom:2px}.day-tab.active{background:#fff;color:#12366b;border-color:#fff}
    main{width:min(880px,100%);margin:0 auto;padding:12px 12px 24px}
    .screen-title{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:4px 2px 10px}.screen-title h1{font-size:22px;margin:0;font-weight:900;letter-spacing:-.4px}.screen-title p{margin:3px 0 0;font-size:11px;color:var(--muted)}
    .day-hero{position:relative;overflow:hidden;border-radius:24px;min-height:184px;margin-bottom:12px;background:linear-gradient(150deg,#0f2346,#274f86);color:#fff;box-shadow:0 14px 36px rgba(18,43,79,.18)}.day-hero.photo{background-size:cover;background-position:center 40%}.day-hero.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,12,26,.08),rgba(3,12,26,.82))}.day-hero-content{position:relative;z-index:2;padding:17px}.hero-kicker{font-size:11px;opacity:.84;font-weight:800}.hero-title{font-size:26px;line-height:1.1;font-weight:950;margin-top:3px;max-width:80%}.hero-sub{font-size:12px;opacity:.88;margin-top:7px;max-width:80%}.hero-facts{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.hero-fact{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800}
    .mode-ribbon{display:flex;gap:7px;align-items:center;margin:0 0 10px}.mode-mini{font-size:10px;color:var(--muted);margin-inline-start:auto}.mode-pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 10px;font-size:11px;font-weight:850}.mode-pill.active{background:#0f5fe0;color:#fff;border-color:#0f5fe0}
    .timeline{position:relative;padding:4px 0 20px}.timeline:before{content:"";position:absolute;right:20px;top:10px;bottom:18px;width:2px;background:rgba(50,89,132,.16)}
    .activity-card{position:relative;display:grid;grid-template-columns:54px minmax(0,1fr);gap:10px;margin:0 0 11px}.dot{position:absolute;right:15px;top:17px;width:12px;height:12px;border-radius:50%;border:3px solid var(--bg);background:var(--blue);z-index:3;box-shadow:0 0 0 3px rgba(25,118,255,.12)}.timebox{padding-top:6px;text-align:center}.start{font-size:13px;font-weight:900;direction:ltr}.duration{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.25}.travel{font-size:9px;color:var(--muted);margin-top:5px;line-height:1.25}.card-body{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 12px 11px;box-shadow:var(--shadow);overflow:hidden}.activity-head{display:flex;gap:10px;align-items:flex-start}.thumb{width:72px;height:72px;border-radius:14px;object-fit:cover;flex:none;background:#dfe6ef}.activity-main{min-width:0;flex:1}.activity-title{font-size:16px;font-weight:900;line-height:1.25;margin:0}.activity-address{font-size:10px;color:var(--muted);margin-top:4px;word-break:break-word}.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:5px 7px;font-size:9px;font-weight:850;background:var(--surface2);border:1px solid var(--line)}.chip.confirmed{background:var(--green-soft);color:var(--green);border-color:#c5ebd5}.chip.review{background:var(--amber-soft);color:var(--amber);border-color:#f0d49e}.chip.cancelled{background:var(--red-soft);color:var(--red);border-color:#f1c2bd}.chip.added{background:#eef0ff;color:#5a48cf;border-color:#cfc9ff}.card-notes{font-size:11px;color:var(--muted);line-height:1.45;margin-top:8px;white-space:pre-wrap}.time-metrics{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.metric{font-size:10px;padding:5px 7px;border-radius:9px;background:var(--surface2);color:var(--muted);font-weight:800}.card-actions{display:grid;grid-template-columns:1fr 1fr;margin-top:9px;gap:7px}.action-btn{min-height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font-size:11px;font-weight:850}.action-btn.primary{background:#0f5fe0;color:#fff;border-color:#0f5fe0}.nav-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}.nav-btn{min-height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:9px;font-weight:850;color:var(--text)}.nav-btn.google{background:#0f5fe0;color:#fff;border-color:#0f5fe0}.status-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.status{min-height:36px;border-radius:10px;border:1px solid var(--line);font-size:10px;font-weight:900;background:var(--surface2)}.status.done{color:var(--green)}.status.pending{color:#2462bf}.status.cancelled{color:var(--red)}.status.active{box-shadow:0 0 0 2px rgba(15,95,224,.17)}
    .special .card-body{background:rgba(7,14,27,.78);border-color:rgba(255,255,255,.14);color:#fff;box-shadow:0 14px 38px rgba(0,0,0,.24);backdrop-filter:blur(6px)}.special .activity-address,.special .card-notes,.special .duration,.special .travel,.special .mode-mini{color:rgba(255,255,255,.72)}.special .chip,.special .metric,.special .nav-btn,.special .status{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15);color:#fff}.special .chip.confirmed{background:rgba(74,198,126,.18);color:#8df0b7}.special .chip.review{background:rgba(255,198,81,.16);color:#ffd36e}.special .chip.added{background:rgba(122,95,255,.22);color:#d7ceff}.special .dot{border-color:#121827}
    .special .day-hero{box-shadow:0 22px 54px rgba(0,0,0,.28)}
    .control-grid,.overview-grid{display:grid;gap:12px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}.panel h3{font-size:14px;margin:0 0 10px}.panel p{margin:0 0 10px;color:var(--muted);font-size:11px;line-height:1.45}.seg2{display:grid;grid-template-columns:1fr 1fr;gap:7px}.choice{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-size:11px;font-weight:900}.choice.active{background:#0f5fe0;color:#fff;border-color:#0f5fe0}.small-note{font-size:10px;color:var(--muted);margin-top:7px}.field{margin:8px 0}.field label{display:block;font-size:10px;font-weight:850;margin-bottom:4px;color:var(--muted)}.field input,.field textarea,.field select{width:100%;min-height:42px;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:12px;padding:9px 10px;outline:none}.field textarea{min-height:72px;resize:vertical}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.wide-btn{width:100%;min-height:44px;border:0;border-radius:12px;background:#0f5fe0;color:#fff;font-size:12px;font-weight:900}.booking-list{display:grid;gap:8px}.booking-item{padding:11px;border:1px solid var(--line);border-radius:14px;background:var(--surface2)}.booking-item strong{display:block;font-size:12px}.booking-item span{display:block;color:var(--muted);font-size:10px;margin-top:3px}
    .review-item{padding:11px;border:1px solid var(--line);border-radius:14px;background:var(--surface2)}.review-item strong{display:block;font-size:12px}.review-item .stars{font-size:13px;margin:4px 0}.review-item p{font-size:11px;color:var(--muted);white-space:pre-wrap;margin:5px 0 0}.review-action{margin-top:8px}
    .empty{padding:28px 14px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:16px;font-size:12px}
    .floating-add{position:fixed;left:14px;bottom:calc(112px + env(safe-area-inset-bottom));z-index:30;min-height:48px;padding:0 16px;border:0;border-radius:999px;background:#0f5fe0;color:#fff;box-shadow:0 12px 28px rgba(15,95,224,.28);font-weight:900;font-size:12px}
    .bottom-filter{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));z-index:35;padding:7px 10px;background:rgba(249,251,253,.94);border-top:1px solid var(--line);backdrop-filter:blur(18px)}.bottom-filter-inner{width:min(620px,100%);margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.filter-btn{min-height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:10px;font-weight:900}.filter-btn.active{background:#0f5fe0;color:#fff;border-color:#0f5fe0}.filter-btn.done.active{background:#1a8a54;border-color:#1a8a54}.filter-btn.cancelled.active{background:#c43b35;border-color:#c43b35}
    .bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:36;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:rgba(249,251,253,.96);border-top:1px solid var(--line);backdrop-filter:blur(20px)}.bottom-nav-inner{width:min(620px,100%);margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.nav-tab{min-height:46px;border:0;background:transparent;border-radius:12px;color:var(--muted);font-size:9px;font-weight:850}.nav-tab span{display:block;font-size:17px;line-height:1;margin-bottom:3px}.nav-tab.active{background:rgba(15,95,224,.09);color:#0f5fe0}
    .modal-backdrop{position:fixed;inset:0;z-index:70;background:rgba(7,17,31,.62);display:flex;align-items:flex-end;justify-content:center;padding:10px}.modal{width:min(680px,100%);max-height:92vh;overflow:auto;background:var(--surface);color:var(--text);border-radius:22px;padding:15px;box-shadow:0 22px 60px rgba(0,0,0,.3)}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:16px;font-weight:900}.close{border:1px solid var(--line);background:var(--surface2);color:var(--text);width:36px;height:36px;border-radius:50%;font-size:19px}.toast{position:fixed;left:50%;bottom:calc(126px + env(safe-area-inset-bottom));transform:translate(-50%,18px);opacity:0;pointer-events:none;transition:.22s;background:#081326;color:#fff;border:1px solid rgba(255,255,255,.1);padding:9px 13px;border-radius:999px;font-size:11px;font-weight:800;z-index:80}.toast.show{opacity:1;transform:translate(-50%,0)}

    /* v12 button alignment */
    .nav-btn,.action-btn,.status,.choice,.wide-btn,.filter-btn,.day-tab,.mode-pill,.head-action,.close{display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1}
    .nav-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.05}
    .day-tab small{width:100%;text-align:center}
    .special-shell{background:radial-gradient(circle at 12% 5%,rgba(255,79,181,.16),transparent 22%),radial-gradient(circle at 90% 18%,rgba(77,124,255,.15),transparent 24%),#0a1020}.special-shell .bottom-nav,.special-shell .bottom-filter{background:rgba(7,12,25,.92);color:#fff;border-color:rgba(255,255,255,.12)}.special-shell .nav-tab{color:rgba(255,255,255,.67)}.special-shell .nav-tab.active{color:#fff;background:rgba(255,255,255,.09)}.special-shell .filter-btn{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);color:rgba(255,255,255,.76)}.special-shell .filter-btn.active{background:#ff3fa4;color:#fff;border-color:#ff3fa4}.special-shell .panel,.special-shell .booking-item,.special-shell .review-item{background:rgba(10,17,33,.84);border-color:rgba(255,255,255,.12);color:#fff}.special-shell .panel p,.special-shell .small-note,.special-shell .booking-item span,.special-shell .review-item p{color:rgba(255,255,255,.7)}
    @media(min-width:700px){main{padding-left:20px;padding-right:20px}.activity-card{grid-template-columns:60px minmax(0,1fr)}.nav-grid{grid-template-columns:repeat(4,1fr)}.control-grid,.overview-grid{grid-template-columns:1fr 1fr}.modal-backdrop{align-items:center}.floating-add{left:calc(50% - 410px)}}
    @media(max-width:450px){.title{font-size:17px}.sub{font-size:10px}.day-tab{min-width:63px}.hero-title{font-size:23px}.thumb{width:64px;height:64px}.activity-title{font-size:15px}.nav-grid{grid-template-columns:repeat(2,1fr)}.card-actions{grid-template-columns:1fr 1fr}.status{font-size:9px;padding:0 3px}.floating-add{left:12px;font-size:11px}.start{font-size:12px}}

    /* v10 visual fixes */
    body.phase-night{background:linear-gradient(180deg,#080f1d 0%,#101b2f 52%,#172338 100%)}
    body.phase-morning{background:linear-gradient(180deg,#d9edff 0%,#f8fbff 48%,#eef4fa 100%)}
    body.phase-evening{background:linear-gradient(180deg,#d9e0ee 0%,#f7f8fb 48%,#e7ebf2 100%)}
    body.special-shell{background:#070d19;isolation:isolate}
    body.special-shell:before{content:"";position:fixed;inset:0;z-index:-2;background-image:var(--special-bg);background-size:cover;background-position:center;filter:saturate(1.08) contrast(1.06);transform:scale(1.03)}
    body.special-shell:after{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(4,8,18,.20) 0%,rgba(4,8,18,.55) 44%,rgba(4,8,18,.88) 100%)}
    .special-shell main{position:relative}
    .special-shell header{background:rgba(4,8,18,.68);border-color:rgba(255,255,255,.14)}
    .special-shell .day-hero{background-color:rgba(6,12,25,.35);border:1px solid rgba(255,255,255,.12)}
    .special-shell .activity-card .card-body{background:rgba(5,10,21,.78);border-color:rgba(255,255,255,.16);color:#fff;box-shadow:0 16px 34px rgba(0,0,0,.24);backdrop-filter:blur(11px)}
    .special-shell .activity-card .activity-address,.special-shell .activity-card .card-notes,.special-shell .activity-card .duration,.special-shell .activity-card .travel{color:rgba(255,255,255,.74)}
    .special-shell .activity-card .chip,.special-shell .activity-card .metric,.special-shell .activity-card .nav-btn,.special-shell .activity-card .status{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#fff}
    .special-shell .activity-card .nav-btn.google{background:#2d7cff;border-color:#2d7cff}
    .special-shell .activity-card .action-btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#fff}
    .special-shell .activity-card .action-btn.primary{background:#ff3fa4;border-color:#ff3fa4}
    .special-shell .activity-card .status.active{box-shadow:0 0 0 2px rgba(255,63,164,.30)}
    .special-shell .activity-card .dot{border-color:#0b1220}
    .special-shell .day-tabs{padding-bottom:3px}
    .special-shell .mode-pill{background:rgba(255,255,255,.07);color:#fff;border-color:rgba(255,255,255,.16)}
    .special-shell .mode-pill.active{background:#ff3fa4;border-color:#ff3fa4;color:#fff}
    .special-shell .floating-add{background:#ff3fa4;box-shadow:0 12px 28px rgba(255,63,164,.30)}
    .special-shell .empty{background:rgba(5,10,21,.70);border-color:rgba(255,255,255,.16);color:rgba(255,255,255,.72)}
    .activity-address{line-height:1.35}
    .travel{font-weight:750}
    .timebox{min-width:0}
    @media(max-width:450px){.activity-head{gap:8px}.activity-address{font-size:9px}.card-body{padding:11px}.day-hero{min-height:176px}.special-shell:before{background-position:center top}}
  </style>
</head>
<body>
<div class="app-shell" id="shell">
  <header>
    <div class="head">
      <img class="logo" id="logo" src="icon-192.png" alt="GO">
      <div class="head-copy"><div class="title" id="title"></div><div class="sub" id="subtitle"></div></div>
      <button class="head-action" id="header-control" type="button" aria-label="שליטה">⚙︎</button>
    </div>
    <div class="day-tabs" id="day-tabs"></div>
  </header>
  <main id="app"></main>
</div>
<script src="app-data.js"></script>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}</script>
</body>
</html>
